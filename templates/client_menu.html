<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/static/img/logo.png">
<!-- Hace que la pagina se vea bien en celulares; viewport-fit=cover usa toda la pantalla -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu cliente</title>

<!-- Fuente pixelada de Google Fonts (parecida a la de Balatro) -->
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">

<style>

/* Lista de reservas dentro del panel */
.lista-reservas {
    display: grid;
    grid-template-columns: repeat(
        auto-fill,
        minmax(220px, 1fr)
    );
    gap: 20px;
}

.reserva-item {
    padding: 16px;
    background: rgba(0, 0, 0, 0.45);
    border: 3px solid var(--cream);
    box-shadow: 4px 4px 0 var(--ink);
}

.reserva-item h3 {
    margin-top: 0;
    color: var(--orange);
}

.reserva-item p {
    font-size: 17px;
    overflow-wrap: anywhere;
}




/* ============================================================
   CARTA BASE (.card): contenedor con perspectiva 3D
   Las variables las mueve initCard() en cada fotograma.
   ============================================================ */
.card{
  --rx:0deg; --ry:0deg; --mx:50%; --my:50%;
  --sc:1; --sx:0px; --sy:10px; --glow:0;
  --dx:0px; --dy:0px;
  position:relative;
  width:clamp(120px,22vw,170px);
  aspect-ratio:5/7;                              /* sin esto la carta mide 0 de alto */
  perspective:700px;
  touch-action:none;
  cursor:grab;
  transform:translate(var(--dx),var(--dy));      /* se mueve al arrastrar */
  -webkit-user-drag:none;
  --px:polygon(
    0 12px, 6px 12px, 6px 6px, 12px 6px, 12px 0,
    calc(100% - 12px) 0, calc(100% - 12px) 6px, calc(100% - 6px) 6px, calc(100% - 6px) 12px, 100% 12px,
    100% calc(100% - 12px), calc(100% - 6px) calc(100% - 12px), calc(100% - 6px) calc(100% - 6px), calc(100% - 12px) calc(100% - 6px), calc(100% - 12px) 100%,
    12px 100%, 12px calc(100% - 6px), 6px calc(100% - 6px), 6px calc(100% - 12px), 0 calc(100% - 12px)
  );
}
.card.dragging{cursor:grabbing}
.card.up{z-index:20}

.shadow{
  position:absolute;inset:6px;
  background:rgba(0,0,0,.45);
  transform:translate(var(--sx),var(--sy)) scale(var(--sc));
  clip-path:var(--px);
}
.tilt{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  transform:rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--sc));
}
.edge,.face{clip-path:var(--px)}
.edge{position:absolute;inset:0;background:var(--ink)}
.face{position:absolute;inset:5px;background:white;overflow:hidden;color:var(--ink)}

.big{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:64px;
  transform:translateZ(40px);
}
.shine{
  position:absolute;inset:0;pointer-events:none;
  opacity:var(--glow);
  background:radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.75), transparent 45%);
  mix-blend-mode:soft-light;
}
.holo{
  position:absolute;inset:-20%;pointer-events:none;
  opacity:calc(var(--glow)*.55);
  mix-blend-mode:color-dodge;
  background:linear-gradient(115deg,#ff2d95,#ffd23f,#3dff9a,#35c8ff,#a45bff,#ff2d95);
  background-size:300% 300%;
  background-position:var(--mx) var(--my);
  filter:saturate(1.4);
}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -5px}}



/* ---------- Cuadrícula de platos (scroll vertical) ---------- */
.platos-grid{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
  align-content:start;
  gap:32px 20px;
  overflow-y:auto;overflow-x:hidden;
  padding:16px 8px 24px;                 /* espacio para que no se corten al inclinarse */
}
.plato{display:flex;flex-direction:column;align-items:center;gap:14px}

/* Cada carta entra con "pop" y sigue flotando */
.plato .card{
  width:100%;max-width:170px;
  animation:aparece .3s steps(4) both, float 3s steps(6) infinite;
  animation-delay:calc(var(--i,0) * .05s), calc(var(--i,0) * -.4s);
}
.plato .face{background:#fff}
/* ---------- Contenido de la carta del plato ---------- */
.plato .big{inset:8px 8px 70px;font-size:64px}        /* zona de la imagen */
.plato .big img{
  max-width:100%;max-height:100%;object-fit:contain;
  /* image-rendering:pixelated;  ← descomenta si tus imágenes son pixel art */
  pointer-events:none;user-select:none;
}
.plato .label{
  position:absolute;left:0;right:0;bottom:34px;
  padding:0 8px;text-align:center;
  font-weight:700;font-size:14px;line-height:1.1;
  transform:translateZ(30px);
}
.plato .precio{
  position:absolute;left:0;right:0;bottom:10px;
  text-align:center;font-weight:700;font-size:16px;
  transform:translateZ(30px);
}
.plato.elegida .edge{background:var(--orange)}         /* borde naranja si ya pediste de este plato */

/* ---------- Botones − contador + ---------- */
.ctrl{display:flex;align-items:center;gap:14px}
.btn-cant{
  --c:var(--blue);--d:var(--blue-d);
  width:36px;height:36px;margin:4px;border:0;cursor:pointer;
  font:700 24px/1 'Pixelify Sans','Courier New',monospace;
  color:#fff;background:var(--c);
  box-shadow:
    0 -4px 0 0 var(--c), 0 4px 0 0 var(--c), -4px 0 0 0 var(--c), 4px 0 0 0 var(--c),
    0 8px 0 0 var(--d), -4px 4px 0 0 var(--d), 4px 4px 0 0 var(--d);
}
.btn-cant.menos{--c:var(--red);--d:var(--red-d)}
.btn-cant.mas{--c:var(--green);--d:var(--green-d)}
.btn-cant:active{                                      /* se hunde */
  transform:translateY(4px);
  box-shadow:0 -4px 0 0 var(--c), 0 4px 0 0 var(--c), -4px 0 0 0 var(--c), 4px 0 0 0 var(--c);
}
.btn-cant:disabled{--c:#8a8697;--d:#5b556a;cursor:not-allowed}
.cant{min-width:2ch;text-align:center;font-weight:700;font-size:24px;text-shadow:0 3px 0 var(--ink)}
.plato.elegida .cant{color:var(--orange)}

/* ---------- Fecha, hora, personas y pie ---------- */
.datos-reserva{flex-shrink:0;display:flex;flex-wrap:wrap;gap:12px 24px;padding:12px 8px 0}
.datos-reserva .campo{margin:0;gap:6px}
.datos-reserva .campo label{font-size:16px}
.datos-reserva .campo input{font-size:18px;padding:10px}
.pie-carta{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:12px}
.pie-carta .bal{margin:0;font-size:20px}
.total{font-size:22px;font-weight:700;text-shadow:0 3px 0 var(--ink)}


/* Cuando se muestran mesas, el contenido deja de hacer scroll vertical
   y se organiza en columna: título arriba, mesas ocupando el resto */
.contenido.con-mesas{
  display:flex;flex-direction:column;
  overflow:hidden;
}

/* ============================================================
   CUADRÍCULA DE MESAS: 2 filas, scroll horizontal
   ============================================================ */
.mesas{
  flex:1;min-height:0;                       /* ocupa el alto que sobra */
  display:grid;
  grid-template-rows:repeat(2, minmax(0,1fr));   /* exactamente 2 filas, del mismo alto */
  grid-auto-flow:column;                     /* se llena de arriba abajo y luego pasa a otra columna */
  grid-auto-columns:clamp(130px,14vw,190px); /* ancho de cada columna */
  gap:16px 20px;
  overflow-x:auto;overflow-y:hidden;         /* scroll SOLO horizontal */
  padding:8px 8px 16px;
  scrollbar-color:var(--rojo-claro) rgba(0,0,0,.4);
}

/* ---------- Cada mesa ---------- */
.mesa{
  display:flex;flex-direction:column;align-items:center;
  gap:8px;min-height:0;
  animation:aparece .3s steps(4) both;       /* entra con "pop" pixelado */
  animation-delay:calc(var(--i,0) * .04s);   /* escalonado: una tras otra */
  transition:transform .12s steps(2);
}
.mesa img{
  flex:1;min-height:0;max-width:100%;
  object-fit:contain;
  image-rendering:pixelated;                 /* nítida, sin suavizar */
  image-rendering:crisp-edges;
  filter:drop-shadow(0 4px 0 rgba(27,22,38,.5));
  -webkit-user-drag:none;user-select:none;
}
.mesa .num{
  font-weight:700;font-size:22px;
  text-shadow:0 3px 0 var(--ink);
  -webkit-font-smoothing:none;
}
.mesa:hover{transform:translateY(-6px);cursor:pointer}
.mesa:hover .num{color:var(--orange)}

@keyframes aparece{
  0%  {opacity:0;scale:.4}
  60% {opacity:1;scale:1.12}
  100%{opacity:1;scale:1}
}



/* ============================================================
   CAJA PIXELADA REUTILIZABLE (.pixbox)
   Capa 1: el elemento, con fondo oscuro = el BORDE
   Capa 2: ::before, 4px más chico, con el color = el RELLENO
   Las dos tienen esquinas en escalón (mismo truco que tus botones)
   ============================================================ */
.pixbox{
  --bg:var(--rojo-claro);        /* color del relleno */
  --esq-out:polygon(
    0 12px, 4px 12px, 4px 8px, 8px 8px, 8px 4px, 12px 4px, 12px 0,
    calc(100% - 12px) 0, calc(100% - 12px) 4px, calc(100% - 8px) 4px, calc(100% - 8px) 8px, calc(100% - 4px) 8px, calc(100% - 4px) 12px, 100% 12px,
    100% calc(100% - 12px), calc(100% - 4px) calc(100% - 12px), calc(100% - 4px) calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) calc(100% - 4px), calc(100% - 12px) calc(100% - 4px), calc(100% - 12px) 100%,
    12px 100%, 12px calc(100% - 4px), 8px calc(100% - 4px), 8px calc(100% - 8px), 4px calc(100% - 8px), 4px calc(100% - 12px), 0 calc(100% - 12px)
  );
  --esq-in:polygon(
    0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0,
    calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px,
    100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%,
    8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px)
  );

  position:relative;
  isolation:isolate;             /* el relleno (z-index:-1) queda detrás del texto, pero delante del borde */
  background:var(--ink);         /* borde oscuro */
  clip-path:var(--esq-out);
}
.pixbox::before{
  content:"";position:absolute;inset:4px;z-index:-1;
  background:
    linear-gradient(rgba(255,255,255,.25) 0 4px, transparent 4px),     /* reflejo arriba */
    linear-gradient(to top, rgba(0,0,0,.22) 0 4px, transparent 4px),   /* sombra abajo */
    var(--bg);
  clip-path:var(--esq-in);
}

/* ============================================================
   LAYOUT A PANTALLA COMPLETA
   [          HEADER (ancho completo)          ]
   [ BARRA  ][          CONTENIDO              ]
   ============================================================ */
.panel{
  position:relative;z-index:2;
  width:100%;height:100%;        /* ocupa toda la pantalla */
  display:flex;flex-direction:column;
  gap:16px;
  padding:16px;                  /* margen respecto al borde de la pantalla */
  /* sin align-items:center → así el header se estira a todo el ancho */
}

/* ---------- HEADER ---------- */
.header{
  flex-shrink:0;                 /* nunca se aplasta */
  padding:16px 28px;
}
.header h1{
  text-align:left;
  font-size:clamp(22px,4vw,34px);
  text-shadow:0 3px 0 var(--ink);
  -webkit-font-smoothing:none;   /* letras sin suavizado = más pixel */
  animation:none;                /* quita esta línea si quieres que el título siga subiendo y bajando */
}

/* ---------- ZONA DE ABAJO: barra + contenido ---------- */
.app{
  flex:1;                        /* toma TODO el alto que sobra debajo del header */
  display:flex;
  gap:16px;
  min-height:0;                  /* necesario para que .contenido pueda hacer scroll por dentro */
}

/* ---------- BARRA LATERAL ---------- */
.sidebar{
  width:clamp(190px,24vw,280px);
  flex-shrink:0;
  display:flex;flex-direction:column;
  gap:14px;
  padding:24px 18px;
}
/* Los enlaces usan tus botones .bal, en versión más chica y a todo el ancho */
.sidebar .bal{
  width:100%;margin:0;text-align:center;
  font-size:20px;
  padding:calc(14px + var(--sink)) 12px calc(22px - var(--sink));
}
.sidebar .bal:last-child{margin-top:auto}      /* "Cerrar sesión" se va al fondo de la barra */
.sidebar .bal:nth-child(2){animation-delay:-.9s}   /* para que no floten todos a la vez */
.sidebar .bal:nth-child(3){animation-delay:-1.7s}

.bal.blue{--c:var(--blue);--d:var(--blue-d)}   /* variante que faltaba */

/* ---------- CONTENIDO (marco blanco pixelado, como el formulario) ---------- */
.contenido{
  flex:1;
  max-width: 1200px;
  min-width:1200px;min-height:0;
  overflow-y:auto;overflow-x:hidden;           /* si hay mucha información, hace scroll aquí */
  margin:4px;                                   /* espacio para que se vea el borde blanco */
  padding:24px;
  background:rgba(0,0,0,.6);
  box-shadow:
    0 -4px 0 0 #fff, 0 4px 0 0 #fff,
    -4px 0 0 0 #fff,  4px 0 0 0 #fff;
  scrollbar-color:var(--rojo-claro) rgba(0,0,0,.4);
}
.contenido h2{margin:0 0 16px;text-shadow:0 3px 0 var(--ink)}
.contenido p{font-size:20px}

/* En pantallas angostas la barra pasa arriba, en fila */
@media (max-width:700px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;padding:14px}
  .sidebar .bal{width:auto;flex:1 1 120px}

  .sidebar .bal:last-child{margin-top:0}
}


.marco .bal{display:block;margin:28px auto 8px}


  
/* Activa la transición automática entre páginas del mismo sitio */
@view-transition{ navigation:auto; }

/* Por defecto el navegador ya hace un crossfade:
   la página vieja baja a opacidad 0 y la nueva sube a 1 AL MISMO TIEMPO.
   Aquí solo ajustamos duración y ritmo. */
::view-transition-old(root),
::view-transition-new(root){
  animation-duration:.1s;               /* más largo = más lento */
  animation-timing-function:steps(6);   /* a saltos, estilo pixel. Quita esta línea para un fundido suave */
}

/* El fondo pixelado son iguales en todas las páginas.
   Con un nombre propio quedan fijos y NO se desvanecen:
   solo cambia el contenido de encima. */
#bg   { view-transition-name:fondo; }


/* ============================================================
   VARIABLES DE COLOR
   Cada botón tiene un color principal (-) y uno oscuro (-d) para
   la sombra/base 3D. Cambia estos valores para otros colores.
   ============================================================ */
:root{
      --felt-dark:#123b30;
  --ink:#1b1626;
  --cream:#f1e9d6;
  --rojo-claro:#d9534a;          /* rojo un poco claro para header y barra */


  --blue:#009dff;   --blue-d:#0064a8;     /* botón azul */
  --red:#fe5f55;    --red-d:#a83a32;      /* botón rojo */
  --orange:#ff9a00; --orange-d:#a8650a;   /* botón naranja */
  --green:#4bc292;  --green-d:#26795a;    /* botón verde */

  box-sizing:border-box;
  /* Deja espacio en celulares con notch (la "muesca" de la cámara) */
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* El padding no hace crecer los elementos (más fácil de calcular tamaños) */
*,*::before,*::after{box-sizing:inherit}

html,body{height:100%;margin:0}

body{
  background:var(--felt-dark);
  font-family:'Pixelify Sans','Courier New',monospace;
  color:var(--cream);
  overflow:hidden;               /* la página no hace scroll: el scroll va dentro de .contenido */
}

/* ============================================================
   FONDO PIXELADO: un canvas pequeño estirado a pantalla completa
   ============================================================ */
#bg{
  position:fixed;inset:0;             /* ocupa toda la pantalla */
  width:100%;height:100%;
  z-index:0;                          /* detrás de todo */
  image-rendering:pixelated;          /* al agrandar, NO suaviza: se ven los píxeles cuadrados */
  image-rendering:crisp-edges;        /* mismo efecto, para Firefox */
}

/* ============================================================
   CONTENEDOR Y TÍTULO
   ============================================================ */
.panel{
  position:relative;z-index:2;        /* por encima del fondo */
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
  padding:24px;
  max-width:100%;
}
h1{
  margin:0;
  font-size:clamp(28px,7vw,44px);     /* tamaño que se adapta a la pantalla (mín, ideal, máx) */
  font-weight:700;text-align:center;
  text-shadow:0 4px 0 var(--ink);     /* sombra sólida hacia abajo, sin difuminar = look pixel */
  animation:bob 2.4s steps(6) infinite; /* el título sube y baja */
}
.row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}

/* ============================================================
   VARIABLE ANIMABLE: cuánto se hunde la cara del botón
   @property permite que el navegador anime esta variable
   (sin esto, el cambio sería instantáneo, aunque también funciona)
   ============================================================ */
@property --sink{
  syntax:'<length>';     /* la variable es una medida en px */
  inherits:false;
  initial-value:0px;     /* 0 = botón levantado */
}

/* ============================================================
   EL BOTÓN (.bal): 3 capas apiladas

     [botón]    → contorno NEGRO (su propio fondo)
     [::before] → BASE oscura (el "grosor" del botón)
     [::after]  → CARA de color (la que se hunde)
     [texto]    → encima de todo
   ============================================================ */
.bal{
        text-decoration: none;
  --c:var(--red);--d:var(--red-d);   /* color de cara y color de base */
  --sink:0px;                           /* cuánto está hundido (0, 4px u 8px) */

  /* FORMAS PIXELADAS: esquinas en escalones de 4px.
     Se guardan en variables para reutilizarlas en cada capa.
     Los % se calculan sobre el tamaño de CADA capa, así que sirven para todas. */

  /* Contorno exterior: esquina de 3 escalones (12px) */
  --outer:polygon(
    0 12px, 4px 12px, 4px 8px, 8px 8px, 8px 4px, 12px 4px, 12px 0,
    calc(100% - 12px) 0, calc(100% - 12px) 4px, calc(100% - 8px) 4px, calc(100% - 8px) 8px, calc(100% - 4px) 8px, calc(100% - 4px) 12px, 100% 12px,
    100% calc(100% - 12px), calc(100% - 4px) calc(100% - 12px), calc(100% - 4px) calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) calc(100% - 4px), calc(100% - 12px) calc(100% - 4px), calc(100% - 12px) 100%,
    12px 100%, 12px calc(100% - 4px), 8px calc(100% - 4px), 8px calc(100% - 8px), 4px calc(100% - 8px), 4px calc(100% - 12px), 0 calc(100% - 12px)
  );
  /* Capas interiores (base y cara): esquina de 2 escalones (8px) */
  --inner:polygon(
    0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0,
    calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px,
    100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%,
    8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px)
  );

  position:relative;
  isolation:isolate;                    /* hace que las capas con z-index:-1 queden DETRÁS del texto pero DELANTE del fondo negro */
  border:0;cursor:pointer;
  background:var(--ink);                /* el fondo del botón es el CONTORNO negro */
  clip-path:var(--outer);               /* recorta el contorno con esquinas pixeladas */

  /* Texto: letra pixelada, sin suavizado, con sombra dura */
  font:700 clamp(20px,5vw,28px)/1 'Pixelify Sans','Courier New',monospace;
  -webkit-font-smoothing:none;          /* letras sin antialiasing = bordes más "pixel" */
  color:#fff;letter-spacing:1px;
  text-shadow:0 4px 0 var(--d);

  /* El padding deja espacio al contorno (4px), la cara y la base (8px).
     Al hundirse, el texto baja: se suma --sink arriba y se resta abajo. */
  padding:calc(20px + var(--sink)) 38px calc(28px - var(--sink));
  margin:8px;

  transition:--sink .12s steps(2), filter .12s steps(2);  /* el hundimiento va "a pasos" */
  animation:idle 2.6s steps(6) infinite;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- CAPA 2: BASE OSCURA (el grosor del botón) ---------- */
.bal::before{
  content:"";position:absolute;z-index:-1;
  inset:4px;                            /* 4px de margen = deja ver el contorno negro */
  background:var(--d);                  /* color oscuro */
  clip-path:var(--inner);
}

/* ---------- CAPA 3: CARA DE COLOR (la que se hunde) ---------- */
.bal::after{
  content:"";position:absolute;z-index:-1;
  /* arriba: 4px + hundimiento | abajo: 12px - hundimiento
     → sin hundir se ven 8px de base; con --sink:8px la cara la tapa por completo */
  inset:calc(4px + var(--sink)) 4px calc(12px - var(--sink)) 4px;
  /* Franja clara de 4px arriba (reflejo pixelado) sobre el color de la cara */
  background:linear-gradient(rgba(255,255,255,.28) 0 4px, transparent 4px), var(--c);
  clip-path:var(--inner);
}

/* Variantes de color: solo cambian las dos variables */
.bal.red{--c:var(--red);--d:var(--red-d)}
.bal.orange{--c:var(--orange);--d:var(--orange-d)}
.bal.green{--c:var(--green);--d:var(--green-d)}

/* Retrasos para que no floten todos sincronizados */
.row .bal:nth-child(2){animation-delay:-.9s}
.row .bal:nth-child(3){animation-delay:-1.7s}

/* ============================================================
   HOVER Y CLIC: ahora el botón se HUNDE en vez de temblar
   ============================================================ */
.bal:hover{
  --sink:4px;                           /* a medio hundir */
  filter:brightness(1.12);
  animation:none;                       /* deja de flotar mientras lo tocas */
}
.bal:active{
  --sink:8px;                           /* hundido del todo: la cara tapa la base */
  filter:brightness(.95);
}
/* El contorno de foco normal se recortaría con clip-path, así que el teclado usa el mismo hundimiento */
.bal:focus-visible{--sink:4px;filter:brightness(1.2);outline:none}

/* Rebote al hacer clic (lo activa el JS con la clase .pop) */
.bal.pop{animation:pop .35s steps(5)}


/* ============================================================
   ANIMACIONES (@keyframes)
   ============================================================ */
/* Flotar en reposo: sube 4px y baja */
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* Título subiendo y bajando */
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* Temblor en hover: rota -2.5°, vuelve, +2.5°, vuelve */
@keyframes wobble{
  0%,100%{transform:translateY(-4px) scale(1.07) rotate(0)}
  25%    {transform:translateY(-4px) scale(1.07) rotate(-2.5deg)}
  75%    {transform:translateY(-4px) scale(1.07) rotate(2.5deg)}
}
/* El brillo viaja de izquierda a derecha */
@keyframes shine{from{left:-30%}to{left:130%}}
/* Rebote al clic: se estira alto, luego ancho, y se asienta */
@keyframes pop{
  0%  {transform:scale(.9,1.12)}
  40% {transform:scale(1.14,.9)}
  70% {transform:scale(.96,1.04)}
  100%{transform:scale(1)}
}

/* Cuadraditos de las partículas (los crea el JS) */
.px{position:fixed;width:10px;height:10px;z-index:5;pointer-events:none}

.hint{font-size:20px;opacity:.75;text-shadow:0 2px 0 var(--ink);text-align:center}

/* Si el usuario pidió "reducir movimiento" en su sistema, apaga las animaciones */
@media (prefers-reduced-motion:reduce){
  .bg,.bal,h1{animation:none!important}
  .bal:hover{animation:none!important}
}
</style>


</head>
<body>
<!-- Capa de fondo con el remolino -->
<canvas id="bg"></canvas>

<main class="panel">

  <header class="header pixbox">
    <h1>Hola, {{ g.usuario['nombre'] }}</h1>
  </header>

  <div class="app">

    <aside class="sidebar pixbox">

    <button type="button" class="bal blue" id="btn-reservas">Reservar</button>
    <button type="button" class="bal blue" id="btn-mis-reservas"> Mis reservas </button>

        <button type="button" class="bal blue" id="btn-mis-cuentas"> Mis cuentas </button>

     <button type="button" class="bal green" id="btn-perfil"> Perfil </button>

      <a class="bal orange" href="{{ url_for('logout') }}">Cerrar sesión</a>
    </aside>

<section class="contenido"
         data-api="{{ url_for('client_reservar') }}"

         data-reservas="{{ url_for('client_reservado') }}"

         data-cuentas="{{ url_for('client_cuentas') }}"
         
          data-nombre="{{ g.usuario['nombre'] }}"
          data-correo="{{ g.usuario['email'] }}"

         data-platos="{{ url_for('client_platos') }}"
         data-confirmar="{{ url_for('client_confirmar') }}"
         data-img="{{ url_for('static', filename='img/mesita.png') }}">
</section>
  </div>
</main>

<script>
// Colores de las partículas según el botón
const colors={blue:'#009dff',red:'#fe5f55',orange:'#ff9a00',green:'#4bc292'};

// Para cada botón .bal de la página:
document.querySelectorAll('.bal').forEach(b=>{
  b.addEventListener('click',e=>{

    // --- Rebote ---
    b.classList.remove('pop');   // quita la clase por si ya estaba
    void b.offsetWidth;          // truco: obliga al navegador a "reiniciar" la animación
    b.classList.add('pop');      // la vuelve a poner → se reproduce otra vez

    // --- Detectar de qué color es el botón ---
    const key=['red','orange','green'].find(k=>b.classList.contains(k))||'blue';

    // --- Posición del clic (si fue con teclado, usa el centro del botón) ---
    const r=b.getBoundingClientRect();
    const cx=e.clientX||r.left+r.width/2, cy=e.clientY||r.top+r.height/2;

    // --- Crear 14 partículas ---
    for(let i=0;i<14;i++){
      const p=document.createElement('div');
      p.className='px';
      // 2 de cada 3 del color del botón, la otra crema
      p.style.background=i%3?colors[key]:'#f1e9d6';
      p.style.left=cx+'px';p.style.top=cy+'px';
      document.body.appendChild(p);

      // Dirección aleatoria (ángulo) y distancia entre 50 y 120px
      const a=Math.random()*Math.PI*2, d=50+Math.random()*70;

      // Animación: sale disparada hacia arriba y luego cae mientras se desvanece
      p.animate([
        {transform:'translate(0,0)',opacity:1},
        {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-30}px)`,opacity:1,offset:.6},
        {transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+40}px)`,opacity:0}
      ],{duration:600,easing:'steps(8)'})   // steps = movimiento entrecortado
       .onfinish=()=>p.remove();            // se borra al terminar
    }
  });
});

/* ============================================================
   REMOLINO PIXELADO
   Se calcula el color de cada píxel en un canvas diminuto.
   ============================================================ */
const cv  = document.getElementById('bg');
const ctx = cv.getContext('2d');

// Paleta de verdes del tapete (RGB). Agrega o quita colores para cambiar el estilo.
const PAL = [
[92, 31, 31], // rojo medio 
[80, 26, 26], // rojo oscuro 
[108, 38, 38], // rojo claro 
[68, 21, 21] // rojo muy oscuro
];

const RES    = 160;   // ancho en "píxeles gordos": menos = más pixelado (prueba 96 o 240)
const ARMS   = 5;     // cuántos brazos tiene el remolino
const TWIST  = 3.2;   // qué tan enroscado está (más alto = espiral más cerrada)
const SPEED  = 0.06;  // velocidad de giro
const FPS    = 12;    // fotogramas por segundo: bajo = movimiento entrecortado retro

let img;              // buffer de píxeles que vamos rellenando

// El canvas mantiene la proporción de la pantalla pero con muy pocos píxeles
function resize(){
  cv.width  = RES;
  cv.height = Math.max(1, Math.round(RES * innerHeight / innerWidth));
  img = ctx.createImageData(cv.width, cv.height);
}

function draw(ms){
  const w = cv.width, h = cv.height;
  const t = ms / 1000;                          // tiempo en segundos
  const maxR = Math.hypot(w, h) / 2;            // distancia del centro a una esquina
  const d = img.data;

  for(let y = 0; y < h; y++){
    for(let x = 0; x < w; x++){
      // Posición del píxel respecto al centro, en coordenadas polares
      const dx = x - w / 2, dy = y - h / 2;
      const r  = Math.hypot(dx, dy) / maxR;     // distancia al centro (0 a 1)
      const a  = Math.atan2(dy, dx);            // ángulo (-π a π)

      // Valor que dibuja la espiral:
      //   ángulo → crea los brazos
      //   r*TWIST → los enrosca según la distancia
      //   -t*SPEED → los hace girar con el tiempo
      //   sin(...) → les da una ondulación, como pintura revuelta
      let v = a / (Math.PI * 2) * ARMS + r * TWIST - t * SPEED
              + 0.12 * Math.sin(r * 9 - t * 0.8);
      v -= Math.floor(v);                       // nos quedamos con 0 a 1

      // Cortamos el valor en bandas: cada banda es un color de la paleta
      const col = PAL[Math.floor(v * PAL.length)];

      // Viñeta pixelada: los bordes se oscurecen en 4 escalones (no suave)
      const dark = 1 - Math.min(1, Math.max(0, (r - 0.45) * 1.4));
      const f = 0.35 + 0.65 * (Math.floor(dark * 4) / 4);

      const i = (y * w + x) * 4;
      d[i]   = col[0] * f;
      d[i+1] = col[1] * f;
      d[i+2] = col[2] * f;
      d[i+3] = 255;                             // opaco
    }
  }
  ctx.putImageData(img, 0, 0);                  // pinta el resultado en el canvas
}

// Bucle de animación limitado a FPS fotogramas por segundo
let last = 0;
function loop(now){
  if(now - last > 1000 / FPS){ draw(now); last = now; }
  requestAnimationFrame(loop);
}

resize();
addEventListener('resize', ()=>{ resize(); draw(performance.now()); });

// Si el usuario pidió "reducir movimiento", se dibuja una sola vez y no se anima
if(matchMedia('(prefers-reduced-motion: reduce)').matches) draw(0);
else requestAnimationFrame(loop);





// ============ VARIABLES GLOBALES (arriba, fuera de las funciones) ============
const contenido   = document.querySelector('.contenido');
const btnReservas = document.getElementById('btn-reservas');

// ============ BORRADOR DE LA RESERVA ============
const reserva = { mesa:null, platos:{}, ...JSON.parse(sessionStorage.getItem('reserva') || '{}') };
const guardar = () => sessionStorage.setItem('reserva', JSON.stringify(reserva));

// ============ PASO 1: LAS MESAS ============
async function mostrarMesas(){
  contenido.classList.add('con-mesas');
  contenido.innerHTML = '<h2>Elige tu mesa</h2><p>Cargando mesas...</p>';

  try{
    const resp = await fetch(contenido.dataset.api);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const mesas = await resp.json();

    contenido.innerHTML = '<h2>Elige tu mesa, recuerda que la reservación es de solamente dos horas</h2>';

    if(mesas.length === 0){
      contenido.insertAdjacentHTML('beforeend', '<p>Todavía no hay mesas registradas.</p>');
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'mesas';

    mesas.forEach((m, i) => {
      const card = document.createElement('div');
      card.className = 'mesa';
      card.style.setProperty('--i', i);
      card.dataset.id = m.id;
      card.dataset.capacidad = m.capacidad;

      const img = document.createElement('img');
      img.src = contenido.dataset.img;
      img.alt = 'Mesa ' + m.numero;

      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = m.numero;

      const cap = document.createElement('span');
      cap.className = 'cap';
      cap.textContent =  m.capacidad + ' personas';

      card.append(img, num, cap);
      grid.appendChild(card);
    });

    contenido.appendChild(grid);

    // Un solo listener en el contenedor: detecta en cuál mesa se hizo clic
    grid.addEventListener('click', e => {
      const card = e.target.closest('.mesa');
      if(!card) return;

      elegirMesa({
        id: card.dataset.id,
        numero: card.querySelector('.num').textContent,
        capacidad: Number(card.dataset.capacidad)
      });
    });

  }catch(err){
    console.error(err);
    contenido.innerHTML = '<h2>Elige tu mesa, recuerda que la reservación es de solamente dos horas</h2><p>No se pudieron cargar las mesas.</p>';
  }
}

// ============ PASO 2: SE ELIGE UNA MESA ============
function elegirMesa(mesa){
  if(!reserva.mesa || reserva.mesa.id !== mesa.id) reserva.platos = {};
  reserva.mesa = mesa;
  reserva.mesa.capacidad = mesa.capacidad || 2;
  guardar();
  mostrarPlatos();
}

// ---------- Utilidades ----------
const MAX_POR_PLATO = 20;
const COP = n => Number(n).toLocaleString('es-CO', { style:'currency', currency:'COP', maximumFractionDigits:0 });
const avisar = m => (typeof mostrarAlerta === 'function' ? mostrarAlerta(m, 'error') : alert(m));

// Crea un elemento con texto seguro (textContent no interpreta HTML)
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(txt !== undefined) n.textContent = txt;
  return n;
};

// ============ SECCIÓN DE PLATOS ============
async function mostrarPlatos(){
  contenido.classList.add('con-mesas');
  contenido.replaceChildren(el('h2', '', 'Mesa ' + reserva.mesa.numero + ' · Elige tus platos'));

  let platos;
  try{
    const resp = await fetch(contenido.dataset.platos);
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    platos = await resp.json();
  }catch(err){
    console.error(err);
    contenido.append(el('p', '', 'No se pudo cargar la carta.'));
    return;
  }

  // Precios para mostrar el total (el servidor lo recalcula al reservar)
  const precios = Object.fromEntries(platos.map(p => [p.id, p.precio]));
  // Si un plato del borrador ya no está disponible, se descarta
  for(const id in reserva.platos) if(!(id in precios)) delete reserva.platos[id];

  const total = el('span', 'total');
  const pintarTotal = () => {
    const n   = Object.values(reserva.platos).reduce((s, c) => s + c, 0);
    const sum = Object.entries(reserva.platos).reduce((s, [id, c]) => s + precios[id] * c, 0);
    total.textContent = n + (n === 1 ? ' plato · ' : ' platos · ') + COP(sum);
  };

  // ---------- Una carta por plato, con sus botones − / + ----------
  const grid = el('div', 'platos-grid');

  platos.forEach((p, i) => {
    const caja = el('div', 'plato');                 // carta + controles
    const card = el('div', 'card');
    card.style.setProperty('--i', i);
    card.title = p.descripcion || '';                // la descripción sale al dejar el cursor encima

    // Imagen (si el archivo no existe, se muestra un emoji)
    const big = el('div', 'big');
    if(p.imagen_url){
      const img = el('img');
      img.src = p.imagen_url;  img.alt = p.nombre;  img.loading = 'lazy';  img.draggable = false;
      img.addEventListener('error', () => img.replaceWith(document.createTextNode('🍕')));
      big.append(img);
    }else{
      big.textContent = '🍕';
    }

    const face = el('div', 'face');
    face.append(big, el('div', 'label', p.nombre), el('div', 'precio', COP(p.precio)),
                el('div', 'holo'), el('div', 'shine'));
    const tilt = el('div', 'tilt');
    tilt.append(el('div', 'edge'), face);
    card.append(el('div', 'shadow'), tilt);

    // Controles: − contador +
    const menos = el('button', 'btn-cant menos', '−');
    const mas   = el('button', 'btn-cant mas', '+');
    const cant  = el('span', 'cant');
    menos.type = mas.type = 'button';
    menos.setAttribute('aria-label', 'Quitar ' + p.nombre);
    mas.setAttribute('aria-label', 'Agregar ' + p.nombre);

    // Refleja la cantidad actual en pantalla
    const pintar = () => {
      const n = reserva.platos[p.id] || 0;
      cant.textContent = n;
      caja.classList.toggle('elegida', n > 0);       // borde naranja si ya hay alguno
      menos.disabled = n === 0;
      mas.disabled   = n >= MAX_POR_PLATO;
    };

    // Cambia la cantidad en el borrador y lo guarda
    const cambiar = delta => {
      const n = Math.max(0, Math.min(MAX_POR_PLATO, (reserva.platos[p.id] || 0) + delta));
      if(n) reserva.platos[p.id] = n;
      else  delete reserva.platos[p.id];             // con 0 se quita del pedido
      pintar();  pintarTotal();  guardar();
    };
    menos.addEventListener('click', () => cambiar(-1));
    mas.addEventListener('click',   () => cambiar(+1));

    const ctrl = el('div', 'ctrl');
    ctrl.append(menos, cant, mas);
    caja.append(card, ctrl);
    grid.append(caja);

    pintar();
    initCard(card);                                  // tilt, brillo y arrastre con resorte
  });

  // ---------- Fecha, hora y personas ----------
  const campo = (etiqueta, tipo, nombre) => {
    const c   = el('div', 'campo');
    const lab = el('label', '', etiqueta);
    const inp = el('input');
    inp.type = tipo;  inp.name = nombre;  inp.id = 'r-' + nombre;  lab.htmlFor = inp.id;
    inp.value = reserva[nombre] || '';
    inp.addEventListener('input', () => { reserva[nombre] = inp.value; guardar(); });
    c.append(lab, inp);
    return [c, inp];
  };
  const [cFecha, fecha]       = campo('Fecha', 'date', 'fecha');
  const [cHora, hora]         = campo('Hora', 'time', 'hora');
  const [cPersonas, personas] = campo('Personas', 'number', 'personas');
  personas.min = 1;

  const hoy = new Date();                            // fecha mínima = hoy (en hora local)
  hoy.setMinutes(hoy.getMinutes() - hoy.getTimezoneOffset());
  fecha.min = hoy.toISOString().slice(0, 10);

  const datos = el('div', 'datos-reserva');
  datos.append(cFecha, cHora, cPersonas);

  // ---------- Pie: cambiar mesa, total y reservar ----------
  const volver = el('button', 'bal blue', 'Cambiar mesa');
  volver.type = 'button';
  volver.addEventListener('click', mostrarMesas);

  const reservar = el('button', 'bal green', 'Reservar');
  reservar.type = 'button';
  reservar.addEventListener('click', () => confirmarReserva(reservar, { fecha, hora, personas }));

  const pie = el('div', 'pie-carta');
  pie.append(volver, total, reservar);

  contenido.append(grid, datos, pie);
  pintarTotal();
}

// ============ ENVIAR LA RESERVA AL SERVIDOR ============
async function confirmarReserva(boton, campos){
  // Validar que haya mesa seleccionada
  if(!reserva.mesa || !reserva.mesa.id){
    avisar('Error: no hay mesa seleccionada. Por favor, elija una mesa primero.');
    boton.disabled = false;
    return;
  }
  
  if(!campos.fecha.value || !campos.hora.value || !campos.personas.value){
    avisar('Completa la fecha, la hora y el número de personas.');
    return;
  }
  boton.disabled = true;                             // evita doble envío

  try{
    const resp = await fetch(contenido.dataset.confirmar, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        mesa_id:  reserva.mesa.id,
        fecha:    campos.fecha.value,
        hora:     campos.hora.value,
        personas: campos.personas.value,
        platos:   reserva.platos                     // {"1": 2, "5": 1} → id: cantidad
      })
    });
    const datos = await resp.json();

    if(!datos.ok){                                   // mesa ocupada, plato agotado, etc.
      avisar(datos.mensaje);
      boton.disabled = false;                        // el borrador se conserva para reintentar
      return;
    }

    // Éxito: el borrador ya es una reserva real, así que se borra
    sessionStorage.removeItem('reserva');
    reserva.mesa = null;  reserva.platos = {};
    for(const k of ['fecha', 'hora', 'personas']) delete reserva[k];

    contenido.classList.remove('con-mesas');
    contenido.replaceChildren(
      el('h2', '', datos.mensaje),
      el('p',  '', 'Número de reserva: ' + datos.reserva_id)
    );

  }catch(err){
    console.error(err);
    avisar('No se pudo conectar con el servidor.');
    boton.disabled = false;
  }
}

// ============ MOTOR DE LAS CARTAS (inclinación, brillo y arrastre con resorte) ============
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function initCard(card){
  const s = {rx:0, ry:0, sc:1, mx:50, my:50, glow:0, lift:0};   // valores actuales
  const t = {rx:0, ry:0, sc:1, mx:50, my:50, glow:0, lift:0};   // valores objetivo
  const p = {x:0, y:0};                                         // desplazamiento por arrastre
  let vx = 0, vy = 0, lx = 0, ly = 0;                           // velocidad y posición anterior
  let drag = false, hover = false, startX = 0, startY = 0, raf = 0;
  const K = 0.09;    // fuerza del resorte (más alto = vuelve más rápido)
  const C = 0.18;    // amortiguación (más bajo = rebota más)

  function tick(){
    let moving = false;

    if(drag){
      vx = vx*.6 + (p.x - lx)*.4;
      vy = vy*.6 + (p.y - ly)*.4;
      lx = p.x;  ly = p.y;
      moving = true;
    }else{
      vx += -K*p.x - C*vx;      // el resorte tira hacia (0,0)
      vy += -K*p.y - C*vy;
      p.x += vx;  p.y += vy;
      if(Math.abs(p.x) < .05 && Math.abs(p.y) < .05 && Math.abs(vx) < .05 && Math.abs(vy) < .05){
        p.x = p.y = vx = vy = 0;
        card.classList.remove('up');
        if(!hover){ t.rx = t.ry = 0; t.sc = 1; t.glow = 0; t.mx = t.my = 50; }
      }else moving = true;
    }

    if(drag || p.x || p.y){            // al moverse, se ladea según la velocidad
      t.ry = clamp(vx*1.1, -28, 28);
      t.rx = clamp(-vy*1.1, -28, 28);
    }

    for(const k in s){                 // suavizado hacia el objetivo
      const d = t[k] - s[k];
      s[k] += d*.14;
      if(Math.abs(d) > .01) moving = true;
    }

    card.style.setProperty('--dx', p.x + 'px');
    card.style.setProperty('--dy', p.y + 'px');
    card.style.setProperty('--rx', s.rx + 'deg');
    card.style.setProperty('--ry', s.ry + 'deg');
    card.style.setProperty('--sc', s.sc);
    card.style.setProperty('--mx', s.mx + '%');
    card.style.setProperty('--my', s.my + '%');
    card.style.setProperty('--glow', s.glow);
    card.style.setProperty('--sx', (-s.ry*1.4) + 'px');
    card.style.setProperty('--sy', (10 + s.rx*1.4 + s.lift*18) + 'px');

    raf = moving ? requestAnimationFrame(tick) : 0;
  }
  const go = () => { if(!raf) raf = requestAnimationFrame(tick); };

  const local = e => {
    const r = card.getBoundingClientRect();
    return { px:(e.clientX - r.left)/r.width, py:(e.clientY - r.top)/r.height };
  };

  card.addEventListener('pointerdown', e => {
    drag = true;
    card.setPointerCapture(e.pointerId);
    startX = e.clientX - p.x;  startY = e.clientY - p.y;
    lx = p.x;  ly = p.y;
    card.classList.add('dragging', 'up');
    t.sc = 1.18;  t.lift = 1;  t.glow = 1;
    go();
  });

  card.addEventListener('pointermove', e => {
    const {px, py} = local(e);
    t.mx = px*100;  t.my = py*100;  t.glow = 1;
    if(drag){
      p.x = e.clientX - startX;
      p.y = e.clientY - startY;
    }else{
      hover = true;
      t.ry = (px - .5)*34;
      t.rx = -(py - .5)*34;
      t.sc = 1.12;
    }
    go();
  });

  const release = e => {
    if(!drag) return;
    drag = false;
    card.classList.remove('dragging');
    t.lift = 0;
    const {px, py} = local(e);
    hover = px >= 0 && px <= 1 && py >= 0 && py <= 1;
    t.sc = hover ? 1.12 : 1;
    go();
  };
  card.addEventListener('pointerup', release);
  card.addEventListener('pointercancel', release);

  card.addEventListener('pointerleave', () => {
    hover = false;
    if(drag) return;
    if(!p.x && !p.y){ t.rx = t.ry = 0; t.sc = 1; t.mx = t.my = 50; t.glow = 0; go(); }
  });
}


// ============ MOSTRAR MIS RESERVAS ============
async function mostrarReservas() {
    contenido.classList.remove('con-mesas');

    contenido.innerHTML = `
        <h2>Mis reservas</h2>
        <p>Cargando reservas...</p>
    `;

    try {
        const resp = await fetch(contenido.dataset.reservas);

        if (!resp.ok) {
            throw new Error('HTTP ' + resp.status);
        }

        const reservas = await resp.json();

        contenido.innerHTML = '<h2>Mis reservas</h2>';

        if (reservas.length === 0) {
            contenido.insertAdjacentHTML(
                'beforeend',
                '<p>No tienes reservas registradas.</p>'
            );
            return;
        }

        const lista = document.createElement('div');
        lista.className = 'lista-reservas';

        reservas.forEach(r => {
            const elemento = document.createElement('div');
            elemento.className = 'reserva-item';

            elemento.innerHTML = `
                <h3>Reserva #${r.reserva_id}</h3>
                <p><strong>Mesa:</strong> ${r.numero_mesa}</p>
                <p><strong>Personas:</strong> ${r.cantidad_personas}</p>
                <p><strong>Fecha:</strong> ${r.fecha}</p>
                <p><strong>Hora:</strong> ${r.hora_inicio}</p>
                <p><strong>A nombre de:</strong> ${r.nombre_usuario}</p>
            `;

            lista.appendChild(elemento);
        });

        contenido.appendChild(lista);

    } catch (err) {
        console.error(err);
        contenido.innerHTML = `
            <h2>Mis reservas</h2>
            <p>No se pudieron cargar las reservas.</p>
        `;
    }
}



function mostrarPerfil() {
    contenido.classList.remove('con-mesas');

    // Limpiamos el contenido anterior
    contenido.replaceChildren();

    const titulo = document.createElement('h2');
    titulo.textContent = 'MI PERFIL';

    const nombre = document.createElement('p');
    nombre.textContent = `Nombre: ${contenido.dataset.nombre}`;

    const correo = document.createElement('p');
    correo.textContent = `Correo: ${contenido.dataset.correo}`;
    contenido.append(titulo, nombre, correo);
}
